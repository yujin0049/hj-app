<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>계획 달력 시안 (가짜 자료)</title>
<style>
body{margin:0;background:#F2F4F6;font-family:-apple-system,'Pretendard','Noto Sans KR',sans-serif;color:#191F28}
.w{max-width:420px;margin:0 auto;padding:12px}
.stamp{font-size:12px;color:#8B95A1;margin:4px 4px 10px}
.card{background:#fff;border-radius:20px;padding:18px;margin-bottom:12px}
h2{font-size:20px;margin:0 0 12px}.seg{display:flex;background:#F2F4F6;border-radius:12px;padding:3px}
.seg b{flex:1;text-align:center;padding:8px;border-radius:10px;font-size:14px;color:#8B95A1}.seg b.on{background:#fff;color:#191F28}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:12px;font-size:12px;text-align:center}
.d{height:44px;border-radius:10px}.d i{display:inline-block;width:6px;height:6px;border-radius:3px;margin:1px}
.y{background:#3182F6}.p{background:#8B5CF6}.t{background:#191F28;color:#fff}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #E5E8EB}
.bar{width:4px;height:36px;border-radius:2px}.dd{margin-left:auto;font-weight:700;font-size:14px}
.warn{color:#E67700}.late{color:#F04452}.chip{display:inline-block;padding:3px 8px;border-radius:8px;font-size:12px;background:#E8F3FF;color:#1B64DA;margin-right:4px}
</style>
<div class="w"><div class="stamp">마지막 갱신 2026-10-21 09:50 (KST)</div>
<div class="card"><h2>계획 달력</h2><div class="seg"><b class="on">월</b><b>주</b></div>
<div style="margin-top:10px"><span class="chip">유진님 할 일</span><span class="chip" style="background:#F3EEFF;color:#6D28D9">교수님 일정</span></div>
<div class="grid">
<b>일</b><b>월</b><b>화</b><b>수</b><b>목</b><b>금</b><b>토</b>
<div class="d"></div><div class="d"></div><div class="d"></div><div class="d t">21<br><i class="y"></i></div><div class="d">22<br><i class="y"></i></div><div class="d">23<br><i class="y"></i></div><div class="d">24</div>
<div class="d">25</div><div class="d">26<br><i class="y"></i><i class="y"></i></div><div class="d">27</div><div class="d">28</div><div class="d">29<br><i class="y"></i></div><div class="d">30<br><i class="y"></i><i class="p"></i></div><div class="d">31</div>
</div></div>
<div class="card"><h2>다가오는 일정</h2>
<div class="row"><span class="bar y"></span><div><b>예시 업무 A</b><br><small>마감 · 강사료</small></div><span class="dd late">지연 2일</span></div>
<div class="row"><span class="bar y"></span><div><b>예시 업무 B</b><br><small>마감 · 기숙사</small></div><span class="dd warn">D-1</span></div>
<div class="row"><span class="bar p"></span><div><b>예시 수업 1회차</b><br><small>교수님 일정</small></div><span class="dd">D-9</span></div>
</div></div>
