# 대장↔클로드 방 모으기 + 대장 깨우기 (계획: 봇공유/조사/261030_대장클로드_채팅방_계획_v01.md)
# 왜 예약 실행(schedule)인가: 예약 실행은 늘 main 에 있는 이 파일로만 돌아요. push 사건은 "푸시된 가지 안의 파일"로 돌아서,
#   그 가지에 쓸 수 있는 누구든 파일을 고쳐 비밀을 빼낼 수 있어요. 그래서 push 사건은 안 써요(pull_request_target 도 안 씀).
# 하는 일: claude/* 가지들의 chat/room.json 을 chat 가지의 chat/room.json 으로 합침(열쇠 없이 글 번호로 합집합, 다른 방이면 안 합침).
#   새 글이 모였으면 웹훅으로 본문 없이 「새 글 있음 + 개수」만 보내요. 대장이 직접 받아 열쇠로 풀어 읽어요.
# 비밀 2개는 대장/유진님이 저장소 Settings → Secrets and variables → Actions 에 넣어요(코드에 없음, 춘식이는 안 만듦):
#   HJ_CHAT_HOOK_URL  : 「클로드 실시간 창구」 웹훅 주소
#   HJ_CHAT_HOOK_AUTH : 그 웹훅의 Authorization 머리글 값
# chat 가지가 아직 없으면 조용히 끝나요(대장이 방을 만든 뒤부터 동작). 공개 저장소라 이 실행 기록도 공개 → 응답 본문은 버려요.
name: chat-collect
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: chat-collect
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'yujin0049/hj-app'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 모으기
        id: c
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          git clone -q --no-checkout --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" r
          cd r
          git fetch -q origin 'refs/heads/main:refs/remotes/origin/main' 'refs/heads/claude/*:refs/remotes/origin/claude/*' || true
          if ! git fetch -q origin 'refs/heads/chat:refs/remotes/origin/chat'; then echo "chat 가지가 아직 없어요(건너뜀)"; echo "added=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          git checkout -q -B chat origin/chat
          git show origin/main:tools/hj_chat.mjs > /tmp/hj_chat.mjs
          mkdir -p /tmp/js && git show origin/main:js/chat-crypto.js > /tmp/js/chat-crypto.js
          mkdir -p /tmp/tools && mv /tmp/hj_chat.mjs /tmp/tools/
          total=0
          for b in $(git for-each-ref --format='%(refname)' 'refs/remotes/origin/claude/'); do
            if git show "$b:chat/room.json" > /tmp/extra.json 2>/dev/null; then
              out=$(node /tmp/tools/hj_chat.mjs merge --file chat/room.json --extra /tmp/extra.json 2>&1) || echo "::warning::${b#refs/remotes/origin/} 안 합침: $out"
              n=$(printf '%s\n' "$out" | sed -n 's/^added=//p')
              total=$((total + ${n:-0}))
            fi
          done
          echo "added=$total" >> "$GITHUB_OUTPUT"
          if [ "$total" -gt 0 ]; then
            who='hj-chat-collect'; dom='users.noreply.github.com'
            git -c user.name="$who" -c user.email="$who@$dom" commit -q -am "chat: 모음 +$total"
            git push -q origin chat || { git pull -q --rebase origin chat && git push -q origin chat; }
          fi
          echo "모은 새 글 $total개"
      - name: 대장 깨우기
        if: steps.c.outputs.added != '0'
        env:
          HOOK_URL: ${{ secrets.HJ_CHAT_HOOK_URL }}
          HOOK_AUTH: ${{ secrets.HJ_CHAT_HOOK_AUTH }}
          N: ${{ steps.c.outputs.added }}
        run: |
          if [ -z "$HOOK_URL" ]; then echo "웹훅 비밀이 아직 없어요(건너뜀)"; exit 0; fi
          body=$(printf '{"source":"hj-chat","text":"대장↔클로드 방에 새 글 %s개가 모였어요. chat 가지 chat/room.json 을 받아 열쇠로 풀어 읽어 주세요.","count":"%s"}' "$N" "$N")
          h=(-H "Content-Type: application/json")
          if [ -n "$HOOK_AUTH" ]; then h+=(-H "Authorization: $HOOK_AUTH"); fi
          curl -sS --fail --max-time 20 -X POST "$HOOK_URL" "${h[@]}" --data "$body" -o /dev/null -w "웹훅 응답 %{http_code}\n"
